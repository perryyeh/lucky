services:
  lucky:
    image: gdy666/lucky:latest
    container_name: lucky
    hostname: lucky
    restart: always
    networks:
      macvlan:
        ipv4_address: ${ipv4}
        ipv6_address: ${ipv6}
        mac_address: ${macaddress}
    volumes:
      - ./:/goodluck

networks:
  macvlan:
    external: true
    name: ${MACVLAN_NET}
