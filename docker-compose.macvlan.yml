services:
  lucky:
    image: gdy666/lucky:latest
    container_name: lucky
    hostname: lucky
    restart: always
    networks:
      macvlan:
        ipv4_address: ${ipv4}
        ipv6_address: ${ipv6}
        mac_address: ${macaddress}
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen=128
    volumes:
      - ./:/goodluck

networks:
  macvlan:
    external: true
    name: ${MACVLAN}
